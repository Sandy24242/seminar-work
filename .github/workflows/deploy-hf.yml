name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
      - master
      - claude/gifted-lamport-nv8e4c
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }} # Format: username/space-name (e.g. Sandy24242/dental-caries-api)
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "Skipping push: HF_TOKEN or HF_SPACE secrets are not configured yet."
            echo "See DEPLOYMENT_GUIDE.md for instructions on setting up GitHub Secrets."
            exit 0
          fi
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git push https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE HEAD:main --force
