[server]
maxUploadSize = 20          # MB, matches config.MAX_UPLOAD_MB
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0E7C86"
backgroundColor = "#F6FBFD"
secondaryBackgroundColor = "#EAF6F8"
textColor = "#0B2545"
font = "sans serif"

[client]
toolbarMode = "minimal"
